name: SkyRL-GPU-E2E-CI-VLM

on:
  schedule:
    - cron: '45 8 * * *'   # Every day at 08:45 UTC (~00:45 PST / ~01:45 PDT)
  workflow_dispatch:

permissions:
  checks: write   # for status checks to appear
  contents: read

jobs:

  skyrl_gpu_e2e_test_vlm:
    if: github.repository == 'NovaSky-AI/SkyRL'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v6
        with:
          activate-environment: true

      - name: Install basic dependencies
        run: uv pip install anyscale==0.26.103 typer==0.9.0

      - name: Install envsubst
        run: sudo apt-get update && sudo apt-get install -y gettext-base

      - name: VLM convergence test (Qwen3-VL-2B, geometry3k)
        env:
          ANYSCALE_CLI_TOKEN: ${{ secrets.ANYSCALE_CLI_TOKEN }}
          ANYSCALE_HOST: https://console.anyscale.com
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          envsubst < ci/anyscale_gpu_e2e_test_vlm.yaml > ci/anyscale_gpu_e2e_test_vlm_envsubst.yaml
          COMMIT_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          JOB_NAME="skyrl-gpu-e2e-test-vlm-${COMMIT_SHA:0:7}-${{ github.run_id }}-${{ github.run_attempt }}"
          bash ci/submit_anyscale_job.sh ci/anyscale_gpu_e2e_test_vlm_envsubst.yaml "$JOB_NAME" 5000
          rm -f ci/anyscale_gpu_e2e_test_vlm_envsubst.yaml
